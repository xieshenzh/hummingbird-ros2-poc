# meta-hb-e2e — container-artifact classes for the end-to-end layered
# bootc image build (hb-oci, hb-chunkah). Classes-only layer: it adds no
# recipes, just the IMAGE_CLASSES that turn a finished rootfs into OCI /
# chunkah / hybrid artifacts. Inherit via kas/phase3.yaml.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "hb-e2e"
BBFILE_PATTERN_hb-e2e = "^${LAYERDIR}/"
BBFILE_PRIORITY_hb-e2e = "15"

LAYERSERIES_COMPAT_hb-e2e = "scarthgap"

# Capture the layer dir for classes (LAYERDIR itself is only defined
# while this file is parsed; classes can't see it)
HB_E2E_LAYERDIR = "${LAYERDIR}"
