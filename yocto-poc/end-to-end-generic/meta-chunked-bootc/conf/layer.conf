# Generic Yocto layer for building chunked bootc images end to end.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "chunked-bootc"
BBFILE_PATTERN_chunked-bootc = "^${LAYERDIR}/"
BBFILE_PRIORITY_chunked-bootc = "20"
LAYERSERIES_COMPAT_chunked-bootc = "scarthgap"
CHUNKED_BOOTC_LAYERDIR = "${LAYERDIR}"
