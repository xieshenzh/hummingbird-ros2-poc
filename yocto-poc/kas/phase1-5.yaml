# Phase 1.5a: build the ROS 2 Jazzy ros_core closure under Yocto.
#
# Modeled on meta-ros's reference kas config for the supported
# scarthgap + jazzy combination (build branch, kas/oeros-scarthgap-jazzy-*),
# with:
#  - machine qemuarm64 (our pipeline target; their reference is x86-64/rpi)
#  - the optional clang / lts-mixins / qt layer fragments dropped — add
#    back only if the closure build demands them
#  - rm_work to keep tmp/ within the EC2 root disk
#
# Phase 1.5b (later): fold the closure into hb-bootc-image via meta-hb-bootc.
header:
  version: 16

machine: qemuarm64
distro: "ros2"

defaults:
  repos:
    branch: "scarthgap"

repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "70dc15941dd33270a92d1001174efb3093e79bdf"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.8"
    commit: "cff3be6f664f8f07a40727ff63eeeb24d6f5e00b"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "b5874ea07d69919d9b40d59f2c2f0bbd24bc3259"
    path: "layers/meta-openembedded"
    layers:
      meta-filesystems:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:

  meta-ros:
    url: "https://github.com/ros/meta-ros.git"
    commit: "c93b6b4d5e2d1537d179b7c83fd178d76ad6270b"
    path: "layers/meta-ros"
    layers:
      meta-ros-common:
      meta-ros2:
      meta-ros2-jazzy:

local_conf_header:
  common: |
    DISTRO_FEATURES += "usrmerge"
    INHERIT += "rm_work"
    INHERIT_DISTRO:remove = "create-spdx"
    WARN_QA:remove = "license-exists"
  systemd: |
    # hb-bootc (Phase 1.5b) requires systemd as pid1; keep the eventual
    # target INIT_MANAGER from the start so the closure is built once
    INIT_MANAGER = "systemd"

target:
  - ros-image-core
