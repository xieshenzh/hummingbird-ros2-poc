apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: anomalynet-v3-yocto-bootc-promotion
  labels:
    app.kubernetes.io/name: anomalynet-v3-yocto-bootc-promotion
    app.kubernetes.io/part-of: anomalynet-promotion
spec:
  description: >-
    Promote the approved OpenShift AI AnomalyNet release into a Yocto/bootc
    image. Training is deliberately not performed by this pipeline.
  params:
    - name: git-url
      type: string
      default: https://github.com/xieshenzh/hummingbird-ros2-poc.git
    - name: git-revision
      type: string
      default: add-ros2-base-images
    - name: model-release
      type: string
      default: anomalynet-v3
    - name: model-sha256
      type: string
      default: 4451989831e5551be121a687cfdb6baafc5b456703c47d64eac74b4ed7554edb
    - name: yocto-builder-image
      type: string
      description: >-
        Pinned image containing kas/BitBake and the host tools required by the
        repository classes: buildah, chunkah, ostree, ostree-encap and skopeo.
      default: image-registry.openshift-image-registry.svc:5000/xieshen-anomalynet-rebuild/yocto-bootc-builder@sha256:b30bd4df07e03aa4fa783bf04a742425a19adaf312ef18ba9096ef126156dfac
    - name: publish-image
      type: string
      description: Optional docker:// destination; empty means build-only.
      default: ""
    - name: publish-username
      type: string
      default: ""
    - name: publish-password
      type: string
      default: ""
  workspaces:
    - name: source
    - name: model
    - name: output
    - name: cache
  tasks:
    - name: clone-source
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.45.2
            script: |
              #!/bin/sh
              set -eu
               # All workspaces share one PVC on the isolated build cluster.
               # The workspace root therefore also contains cache/ and
               # output/; never clean the workspace root itself.
               repo="$(workspaces.source.path)/repo"
               rm -rf "$repo"
               mkdir -p "$(workspaces.source.path)"
               git clone --depth 1 --branch "$(params.revision)" "$(params.url)" "$repo"
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source

    - name: stage-approved-model
      runAfter: [clone-source]
      taskSpec:
        params:
          - name: release
            type: string
          - name: expected-sha256
            type: string
        workspaces:
          - name: source
        steps:
          - name: copy-and-verify
            image: registry.access.redhat.com/ubi9:9.5
            script: |
              #!/usr/bin/bash
              set -euo pipefail
              root="$(workspaces.source.path)/repo/yocto-poc/bootc-chunked-inference"
              # The cluster uses Tekton coschedule=workspaces. A TaskRun may
              # mount only one PVC-backed workspace in that mode. The model
              # input is therefore the model/ subdirectory of the shared
              # source workspace.
              # The model workspace previously mounted the same PVC at its
              # root. Preserve that layout through the single source mount.
              input="$(workspaces.source.path)"
              release="$(params.release)"
              expected="$(params.expected-sha256)"
              # The isolated build cluster uses one PVC for all pipeline
              # workspaces. If the model workspace is empty, use the approved
              # copy already present in the checked-out source tree.
              if ! test -f "$input/model.json"; then
                input="$root/models/$release"
              fi
              test -f "$input/model.json"
              test -f "$input/model-manifest.json"
              actual="$(sha256sum "$input/model.json" | awk '{print $1}')"
              test "$actual" = "$expected"
              manifest_sha="$(grep -o '"sha256"[[:space:]]*:[[:space:]]*"[^"]*"' "$input/model-manifest.json" | head -1 | sed 's/.*"sha256"[[:space:]]*:[[:space:]]*"\([^"]*\)"/\1/')"
              test "$manifest_sha" = "$expected"
              mkdir -p "$root/models/$release" \
                "$root/meta-chunked-bootc/recipes-inference/edge-inference-model/files/$release"
              if test "$input" != "$root/models/$release"; then
                cp "$input/model.json" "$input/model-manifest.json" "$root/models/$release/"
                cp "$input/model.json" "$input/model-manifest.json" \
                  "$root/meta-chunked-bootc/recipes-inference/edge-inference-model/files/$release/"
              fi
              printf '%s  %s\n' "$actual" model.json > "$root/models/$release/checksums.txt"
              printf '%s  %s\n' "$actual" model.json > "$root/meta-chunked-bootc/recipes-inference/edge-inference-model/files/$release/checksums.txt"
              echo "approved model $release verified: $actual"
      params:
        - name: release
          value: $(params.model-release)
        - name: expected-sha256
          value: $(params.model-sha256)
      workspaces:
        - name: source
          workspace: source

    - name: yocto-build
      runAfter: [stage-approved-model]
      taskSpec:
        params:
          - name: builder-image
            type: string
          - name: release
            type: string
        workspaces:
          - name: source
        steps:
          - name: build
            image: $(params.builder-image)
            workingDir: $(workspaces.source.path)/repo/yocto-poc/bootc-chunked-inference
            script: |
                #!/usr/bin/env bash
                set -euo pipefail
                repo_dir="$(find "$(workspaces.source.path)" -type d \
                 -path '*/yocto-poc/bootc-chunked-inference' -print -quit)"
                test -n "$repo_dir"
                cd "$repo_dir"
                for tool in kas buildah chunkah ostree ostree-encap skopeo; do
                 command -v "$tool" >/dev/null || { echo "missing build tool: $tool" >&2; exit 20; }
                done
                test "$(params.release)" = anomalynet-v3
                # The builder image is created and digest-pinned before this
                # PipelineRun. Its final stage contains the static helper;
                # compilation is deliberately excluded from the promotion run.
                test -x /usr/local/libexec/chunked-bootc-skopeo-static
                cache_root="$(workspaces.source.path)"
                # The isolated cluster's PVC already contains cache/, which
                # is the layout used by the completed build-3 run. Tekton
                # mounts the same PVC at each workspace root, so normalize to
                # that existing subdirectory instead of creating a new cache.
                if test -d "$cache_root/cache"; then
                  cache_root="$cache_root/cache"
                fi
                mkdir -p "$cache_root/downloads" "$cache_root/sstate-cache" "$cache_root/kas-work"
                export KAS_WORK_DIR="$cache_root/kas-work"
                # Older revisions of this branch placed local_conf_header under
                # repos. Normalize that layout before KAS validates the manifest.
                kas_file="$repo_dir/kas/bootc-chunked-inference-qemux86-64-anomalynet-v3.yaml"
                if ! test -f "$kas_file"; then
                  cp "$repo_dir/kas/bootc-chunked-inference-qemuarm64-anomalynet-v3.yaml" "$kas_file"
                  sed -i 's/^machine: qemuarm64$/machine: qemux86-64/' "$kas_file"
                 fi
                 sed -i "s#/workspace/cache#$cache_root#g" "$kas_file"
                 kas checkout "$kas_file"
                 rm -rf "$KAS_WORK_DIR/meta-chunked-bootc"
                 cp -a "$repo_dir/meta-chunked-bootc" "$KAS_WORK_DIR/meta-chunked-bootc"
                 bitbake_bin="$(find "$KAS_WORK_DIR" -path '*/bitbake/bin/bitbake' -type f -print -quit)"
                test -n "$bitbake_bin"
                "$bitbake_bin" --version
                deploy="$KAS_WORK_DIR/build/tmp/deploy/images/qemux86-64"
                # Always rerun the image assembly when the builder image changes.
                # The deploy tree can contain an OCI assembled with an older
                # architecture-specific helper (for example, an ARM64 skopeo
                # copied into an AMD64 image).  KAS/BitBake still reuses the
                # downloads and sstate cache, so this does not require a cold
                # Yocto build while ensuring the current helper is embedded.
                 rm -rf "$deploy"/generic-inference-bootc-image*.oci
                 kas build "$kas_file"
                 # The chunked OCI tasks are image-side assembly tasks and may
                 # remain valid in BitBake sstate when only their helper script
                 # changes.  Force both assembly stages after the cached build
                 # so the deploy output always reflects the checked-out source.
                 cd "$KAS_WORK_DIR/build"
                 "$bitbake_bin" generic-inference-bootc-image -c chunked_bootc_chunk -f
                 "$bitbake_bin" generic-inference-bootc-image -c chunked_bootc_hybrid -f
                 test -d "$deploy/generic-inference-bootc-image-hybrid.oci"
                mkdir -p "$(workspaces.source.path)/output"
                cp -a "$deploy/generic-inference-bootc-image"*.oci "$(workspaces.source.path)/output/"
                sha256sum "$repo_dir/models/$(params.release)/model.json" > "$(workspaces.source.path)/output/model.sha256"
                printf '%s\n' "$(params.release)" > "$(workspaces.source.path)/output/model-release"
      params:
        - name: builder-image
          value: $(params.yocto-builder-image)
        - name: release
          value: $(params.model-release)
      workspaces:
        - name: source
          workspace: source

    - name: validate-artifact
      runAfter: [yocto-build]
      taskSpec:
        params:
          - name: release
            type: string
          - name: expected-sha256
            type: string
        workspaces:
          - name: source
        steps:
          - name: validate
            image: registry.access.redhat.com/ubi9:9.5
            script: |
              #!/usr/bin/bash
              set -euo pipefail
              output="$(workspaces.source.path)/output"
              test "$(cat "$output/model-release")" = "$(params.release)"
              test "$(awk '{print $1}' "$output/model.sha256")" = "$(params.expected-sha256)"
              test -d "$output/generic-inference-bootc-image-hybrid.oci"
              grep -R -q "$(params.release)" "$(workspaces.source.path)/repo/yocto-poc/bootc-chunked-inference/models/$(params.release)/model-manifest.json"
              echo "Phase 4 artifact validation: PASS"
      params:
        - name: release
          value: $(params.model-release)
        - name: expected-sha256
          value: $(params.model-sha256)
      workspaces:
        - name: source
          workspace: source

    - name: publish-oci
      runAfter: [validate-artifact]
      when:
        - input: $(params.publish-image)
          operator: notin
          values: [""]
      taskSpec:
        params:
          - name: destination
            type: string
          - name: username
            type: string
          - name: password
            type: string
        workspaces:
          - name: source
        steps:
          - name: copy
            image: quay.io/skopeo/stable:v1.15
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              test -n "$(params.username)" && test -n "$(params.password)"
              skopeo copy --dest-tls-verify=false \
                --dest-creds "$(params.username):$(params.password)" \
                "oci:$(workspaces.source.path)/output/generic-inference-bootc-image-hybrid.oci" \
                "docker://$(params.destination)"
              echo "published $(params.destination)"
      params:
        - name: destination
          value: $(params.publish-image)
        - name: username
          value: $(params.publish-username)
        - name: password
          value: $(params.publish-password)
      workspaces:
        - name: source
          workspace: source
