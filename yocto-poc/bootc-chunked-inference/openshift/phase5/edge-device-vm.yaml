# Phase 5 single-device VM contract.
#
# This manifest intentionally expects a disk PVC produced by the bootc image
# conversion step.  A bootable OCI image is not a KubeVirt containerDisk:
# it must first be installed into a raw/qcow2 disk and imported into CDI.
# Replace phase4-bootc-disk-anomalynet-v3 with that imported PVC before apply.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: edge-device-001
  labels:
    app.kubernetes.io/name: edge-device
    app.kubernetes.io/part-of: anomalynet-phase5
    edge.hummingbird.io/wave: "0"
    edge.hummingbird.io/device-id: edge-device-001
  annotations:
    edge.hummingbird.io/bootc-release: anomalynet-v3
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-device
        app.kubernetes.io/part-of: anomalynet-phase5
        edge.hummingbird.io/device-id: edge-device-001
    spec:
      domain:
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: phase4-bootc-disk-anomalynet-v3
        # The guest agent reads these values from the kernel command line in
        # the first disk-image preparation iteration. Keep the values here as
        # the source of truth for the VM test even before injection is wired.
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              write_files:
                - path: /etc/edge-device/identity
                  permissions: '0644'
                  content: |
                    {"device_id":"edge-device-001","wave":0}
                - path: /etc/edge-device/sensor.json
                  permissions: '0644'
                  content: |
                    {"sensor":"simulated","temperature_c":25.0}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: edge-device-001
  labels:
    app.kubernetes.io/part-of: anomalynet-phase5
    edge.hummingbird.io/device-id: edge-device-001
spec:
  selector:
    kubevirt.io/domain: edge-device-001
  ports:
    - name: inference
      port: 8080
      targetPort: 8080
    - name: device-status
      port: 8090
      targetPort: 8090
