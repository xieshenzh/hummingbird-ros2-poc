# Tekton orchestration for the two externally provided VM phases.
#
# Tekton pods are control/transfer clients only. Native conversion runs on the
# Fedora conversion VM; deployment and QEMU validation run on the separate
# deployment VM. The raw image and boot assets are copied back to OpenShift
# storage between the two PipelineRuns.
#
# Required namespace-local Secret, created out-of-band:
#   anomalynet-vm-ssh: privateKey, knownHosts
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: anomalynet-v3-convert-collect-vm
  labels:
    app.kubernetes.io/name: anomalynet-v3-convert-collect-vm
    app.kubernetes.io/part-of: anomalynet-phase5
    hummingbird.io/owner: opencode
spec:
  params:
    - name: conversion-host
      type: string
    - name: conversion-user
      type: string
      default: fedora
  workspaces:
    - name: workspace
  tasks:
    - name: convert-on-fedora
      taskSpec:
        params:
          - name: conversion-host
            type: string
          - name: conversion-user
            type: string
        workspaces:
          - name: workspace
        volumes:
          - name: vm-ssh
            secret:
              secretName: anomalynet-vm-ssh
        steps:
          - name: transfer-convert-collect
            image: quay.io/fedora/fedora:40
            volumeMounts:
              - name: vm-ssh
                mountPath: /var/run/anomalynet-vm-ssh
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              dnf install -y openssh-clients tar gzip >/dev/null
              install -d -m 700 "$HOME/.ssh"
              cp /var/run/anomalynet-vm-ssh/knownHosts "$HOME/.ssh/known_hosts"
              key=/tmp/anomalynet-vm-private-key
              cp /var/run/anomalynet-vm-ssh/privateKey "$key"
              chmod 600 "$key"
              host="$(params.conversion-user)@$(params.conversion-host)"
              remote="/home/$(params.conversion-user)/anomalynet-tekton-convert"
              ssh -i "$key" "$host" "rm -rf '$remote' && mkdir -p '$remote'"
              root="$(workspaces.workspace.path)"
              source="$root"
              artifacts="$root/output/tekton-artifacts-32830c0"
              tar -C "$source/output" -cf - \
                generic-inference-bootc-image-hybrid.oci | \
                ssh -i "$key" "$host" "tar -C '$remote' -xf -"
              scp -i "$key" \
                "$source/repo/yocto-poc/bootc-chunked-inference/scripts/fedora-vm-convert-collect.sh" \
                "$host:$remote/convert.sh"
              ssh -i "$key" "$host" "chmod 755 '$remote/convert.sh' && '$remote/convert.sh' '$remote/generic-inference-bootc-image-hybrid.oci' '$remote/output'"
              rm -rf "$artifacts"
              mkdir -p "$artifacts"
              scp -i "$key" -r "$host:$remote/output/." "$artifacts/"
              test -s "$artifacts/disk.img"
              (cd "$artifacts" && sha256sum -c disk.img.sha256)
              printf 'artifact_transfer=passed\n' > "$artifacts/TEKTON-METADATA"
      params:
        - name: conversion-host
          value: $(params.conversion-host)
        - name: conversion-user
          value: $(params.conversion-user)
      workspaces:
        - name: workspace
          workspace: workspace
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: anomalynet-v3-deploy-qemu-vm
  labels:
    app.kubernetes.io/name: anomalynet-deploy-qemu-vm
    app.kubernetes.io/part-of: anomalynet-phase5
    hummingbird.io/owner: opencode
spec:
  params:
    - name: deployment-host
      type: string
    - name: deployment-user
      type: string
      default: fedora
    - name: target-disk
      type: string
      default: /dev/nvme1n1
  workspaces:
    - name: workspace
  tasks:
    - name: deploy-and-verify-qemu
      taskSpec:
        params:
          - name: deployment-host
            type: string
          - name: deployment-user
            type: string
          - name: target-disk
            type: string
        workspaces:
          - name: workspace
        volumes:
          - name: vm-ssh
            secret:
              secretName: anomalynet-vm-ssh
        steps:
          - name: transfer-deploy-verify
            image: quay.io/fedora/fedora:40
            volumeMounts:
              - name: vm-ssh
                mountPath: /var/run/anomalynet-vm-ssh
                readOnly: true
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              dnf install -y openssh-clients tar gzip >/dev/null
              install -d -m 700 "$HOME/.ssh"
              cp /var/run/anomalynet-vm-ssh/knownHosts "$HOME/.ssh/known_hosts"
              key=/tmp/anomalynet-vm-private-key
              cp /var/run/anomalynet-vm-ssh/privateKey "$key"
              chmod 600 "$key"
              host="$(params.deployment-user)@$(params.deployment-host)"
              remote="/home/$(params.deployment-user)/anomalynet-tekton-deploy"
              ssh -i "$key" "$host" "rm -rf '$remote' && mkdir -p '$remote'"
              root="$(workspaces.workspace.path)"
              source="$root"
              artifacts="$root/output/tekton-artifacts-32830c0"
              tar -C "$artifacts" -cf - . | \
                ssh -i "$key" "$host" "tar -C '$remote' -xf -"
              scp -i "$key" \
                "$source/repo/yocto-poc/bootc-chunked-inference/scripts/fedora-qemu-deploy-verify.sh" \
                "$host:$remote/deploy.sh"
              ssh -tt -i "$key" "$host" \
                "chmod 755 '$remote/deploy.sh' && '$remote/deploy.sh' '$remote' '$(params.target-disk)'"
              echo 'QEMU deployment and guest verification: PASS'
      params:
        - name: deployment-host
          value: $(params.deployment-host)
        - name: deployment-user
          value: $(params.deployment-user)
        - name: target-disk
          value: $(params.target-disk)
      workspaces:
        - name: workspace
          workspace: workspace
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: anomalynet-v3-convert-collect-32830c0
  labels:
    app.kubernetes.io/name: anomalynet-v3-convert-collect-vm
    app.kubernetes.io/part-of: anomalynet-phase5
    hummingbird.io/owner: opencode
spec:
  pipelineRef:
    name: anomalynet-v3-convert-collect-vm
  params:
    - name: conversion-host
      value: fedora-conversion-vm.example.invalid
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: workspace
      persistentVolumeClaim:
        claimName: phase4-yocto-workspace
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: anomalynet-v3-deploy-qemu-32830c0
  labels:
    app.kubernetes.io/name: anomalynet-deploy-qemu-vm
    app.kubernetes.io/part-of: anomalynet-phase5
    hummingbird.io/owner: opencode
spec:
  pipelineRef:
    name: anomalynet-v3-deploy-qemu-vm
  params:
    - name: deployment-host
      value: qemu-deployment-vm.example.invalid
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: workspace
      persistentVolumeClaim:
        claimName: phase4-yocto-workspace
