apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-first-model

resources:
  - openshift/phase3-release-pvc.yaml
  - openshift/phase3-pytorchjob.yaml
  - openshift/anomalynet-v3-inferenceservice.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: anomalynet-v3-training-source
    files:
      - finetune-anomalynet.py=models/training/finetune-anomalynet.py
  - name: anomalynet-v3-service
    files:
      - kserve-anomalynet.py=openshift/kserve-anomalynet.py
  - name: anomalynet-v3-model
    files:
      - model.json=models/anomalynet-v3/model.json
      - model-manifest.json=models/anomalynet-v3/model-manifest.json
