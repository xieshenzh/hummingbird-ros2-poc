# Real-time tuning kernel arguments for the PREEMPT_RT kernel.
#
# bootc merges every /usr/lib/bootc/kargs.d/*.toml into the boot loader entry at
# deploy time (alongside the base's 00-base.toml console args).
#
# CONSERVATIVE DEFAULTS ONLY — intrinsic RT tuning that is safe on any target.
# These belong in the base RT image because they are inseparable from running an
# RT kernel at all. Robot-WORKLOAD-specific tuning (CPU isolation) does NOT go
# here: per the base-consistency principle (docs/realtime-kernel.md) the base
# stays consistent with upstream bootc-os and any robot customization lives in
# the ros2/robot image layer. The aggressive CPU-isolation arguments (isolcpus /
# nohz_full / rcu_nocbs) are hardware- and workload-specific and can make a
# machine unusable if the CPU ranges are wrong, so they are shown below only as a
# template to copy into the ros2 image's OWN kargs.d drop-in.
kargs = [
  # Keep the dynamic-preempt model at full preemption too (PREEMPT_DYNAMIC is
  # also enabled in the RT build; harmless and explicit on an RT kernel).
  "preempt=full",
  # The soft/hard lockup watchdogs fire a periodic timer that adds latency
  # jitter; disable them for deterministic behaviour.
  "nowatchdog",
]

# ── Aggressive isolation template — belongs in the ros2/robot image layer ──
# EXAMPLE, do not enable blindly. For an 8-core robot dedicating cores 2-7 to
# real-time work and keeping the housekeeping load on cores 0-1. Put these in a
# kargs.d/*.toml drop-in inside the ros2/robot image (NOT this base file), after
# adjusting the CPU ranges to the target robot:
#
#   "isolcpus=managed_irq,domain,2-7",  # keep the scheduler + managed IRQs off 2-7
#   "nohz_full=2-7",                    # stop the scheduler tick on isolated CPUs
#   "rcu_nocbs=2-7",                    # offload RCU callbacks away from 2-7
#   "irqaffinity=0-1",                  # pin device IRQs to the housekeeping CPUs
#   "skew_tick=1",                      # de-synchronise remaining timer ticks